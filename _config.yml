# Site
title: Felix Lambert
tagline: Mobile Engineer · React Native, React
description: >-
  Felix Lambert is a mobile engineer based in Toronto with 10+ years in
  front-end and mobile development (React Native, React). Bilingual
  English/French. Open to new opportunities.
url: "https://felix-lambert.github.io"
baseurl: ""
lang: en
timezone: America/Toronto
image: /assets/img/og-card.png
logo: /assets/img/avatar.jpg

author:
  name: Felix Lambert
  email: lambertfelix8@gmail.com
  twitter:

social:
  name: Felix Lambert
  links:
    - https://www.linkedin.com/in/felix-lambert-6870b720a/
    - https://github.com/felix-lambert
    - https://www.malt.fr/profile/felixlambert1

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji

feed:
  path: feed.xml

collections_dir: all_collections
collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: page
      lang: en
      image: /assets/img/og-card.png
  - scope:
      path: "fr"
    values:
      lang: fr
  - scope:
      path: "_posts"
    values:
      layout: post
      permalink: /posts/:categories/:year/:month/:day/:title/

exclude:
  - LICENSE
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools
  - node_modules
  - vendor
