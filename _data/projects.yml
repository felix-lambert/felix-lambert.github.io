- id: sport-challenge
  name: Sport Challenge
  status: wip
  ongoing: true
  period: 2026 – present
  tags: [Expo SDK 57, React Native, TypeScript, Expo Router, "@expo/ui", Reanimated 4, EAS]
  links: []
  en:
    tagline: Thirty body-weight exercises, played as a ladder of levels
    text: >-
      A home-workout app built like a game: pass the current level to unlock
      the next, then read the sourced health benefit of what you just did.
      Skip three days and the last level locks again. Everything stays on
      the phone: no account, no server. In progress, currently in preview
      on Android.
    highlights:
      - Native look on both platforms through @expo/ui (SwiftUI on iOS, Jetpack Compose on Android), Reanimated 4 animations, expo-sqlite storage
      - Tests, type-check and lint on every pull request; EAS release workflow with over-the-air updates on every push to main
  fr:
    tagline: Trente exercices au poids du corps, joués comme une échelle de niveaux
    text: >-
      Une app de sport à la maison construite comme un jeu : on réussit le
      niveau en cours pour débloquer le suivant, puis on lit le bénéfice santé
      sourcé de ce qu'on vient de faire. Trois jours sans séance et le dernier
      niveau se referme. Tout reste sur le téléphone : pas de compte, pas de
      serveur. En cours, actuellement en preview sur Android.
    highlights:
      - Rendu natif sur les deux plateformes via @expo/ui (SwiftUI sur iOS, Jetpack Compose sur Android), animations Reanimated 4, stockage expo-sqlite
      - Tests, typage et lint sur chaque pull request ; workflow de release EAS avec mises à jour OTA à chaque push sur main

- id: korean-challenge
  name: Korean Challenge
  status: wip
  ongoing: true
  period: 2026 – present
  tags: [Expo SDK 57, React Native, TypeScript, Expo Router, "@expo/ui", Reanimated 4, expo-speech, EAS]
  links: []
  en:
    tagline: Learn Korean as a map of worlds to unlock
    text: >-
      The Sport Challenge concept applied to language learning: a ladder of
      Korean levels drawn as a map of worlds, each one a timed round of nine
      kinds of question (recognise, produce, listen, build, sprint, no
      mistakes) drawn from short lessons. Three days away and the last level
      locks again. French or English interface, Korean either way, all
      on-device.
    highlights:
      - Curriculum, pedagogy and ladder rules as pure TypeScript modules with tests; generated speech assets for the coach
      - Same native stack and release pipeline as Sport Challenge, plus headless-browser probes to review many screens at once
  fr:
    tagline: Apprendre le coréen comme une carte de mondes à débloquer
    text: >-
      Le concept de Sport Challenge appliqué à l'apprentissage d'une langue :
      une échelle de niveaux de coréen dessinée comme une carte de mondes,
      chaque niveau étant une manche chronométrée de neuf types de questions
      (reconnaître, produire, écouter, construire, sprint, sans faute) tirées
      de courtes leçons. Trois jours d'absence et le dernier niveau se
      referme. Interface en français ou en anglais, tout sur l'appareil.
    highlights:
      - Programme, pédagogie et règles de progression en modules TypeScript purs et testés ; voix du coach générée à partir du programme
      - Même stack native et même pipeline de release que Sport Challenge, plus des sondes navigateur headless pour relire de nombreux écrans d'un coup

- id: histoire-du-monde
  name: Histoire du monde
  status: wip
  ongoing: true
  period: 2025 – present
  tags: [Writing, Data curation, Static site, WebP pipeline, Cloudflare R2]
  links: []
  en:
    tagline: A 715-entry timeline from the Big Bang to today
    text: >-
      A long-form personal research project: a chronology in 14 chapters,
      from cosmology to the present day, each entry sourced and illustrated.
      I built the tooling around it too: image conversion to WebP, media
      hosting on Cloudflare R2 and video generation. Not published yet; it is
      being reworked before going back online.
    highlights:
      - 715 dated entries, 14 chapters, hundreds of captioned illustrations
      - Custom scripts for media optimisation and upload
  fr:
    tagline: Une chronologie de 715 entrées, du Big Bang à aujourd'hui
    text: >-
      Un projet de recherche personnel au long cours : une chronologie en
      14 chapitres, de la cosmologie à nos jours, chaque entrée sourcée et
      illustrée. J'ai aussi construit l'outillage autour : conversion des
      images en WebP, hébergement des médias sur Cloudflare R2 et génération
      de vidéos. Pas encore publié ; il est retravaillé avant de revenir en
      ligne.
    highlights:
      - 715 entrées datées, 14 chapitres, des centaines d'illustrations légendées
      - Scripts maison d'optimisation et d'envoi des médias

