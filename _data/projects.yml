- id: sport-challenge
  name: Sport Challenge
  status: live
  ongoing: true
  period: 2026 – present
  tags: [Expo SDK 58, React Native, TypeScript, Expo Router, "@expo/ui", Reanimated 4, EAS]
  links:
    - label: App Store
      url: https://apps.apple.com/app/sport-challenge-home-workout/id6819818056
    - label: Google Play
      url: https://play.google.com/store/apps/details?id=com.felixlambert.sportchallenge
    - label: YouTube
      url: https://www.youtube.com/@sportchallenge-z2q
  en:
    tagline: Thirty body-weight exercises, played as a ladder of levels
    text: >-
      A home-workout app built like a game: pass the current level to unlock
      the next, then read the sourced health benefit of what you just did.
      Skip three days and the last level locks again. Everything stays on
      the phone: no account, no server. Live on the App Store and Google
      Play.
    highlights:
      - Native look on both platforms through @expo/ui (SwiftUI on iOS, Jetpack Compose on Android), Reanimated 4 animations, expo-sqlite storage
      - Tests, type-check and lint on every pull request; EAS release workflow with over-the-air updates on every push to main
  fr:
    tagline: Trente exercices au poids du corps, joués comme une échelle de niveaux
    text: >-
      Une app de sport à la maison construite comme un jeu : on réussit le
      niveau en cours pour débloquer le suivant, puis on lit le bénéfice santé
      sourcé de ce qu'on vient de faire. Trois jours sans séance et le dernier
      niveau se referme. Tout reste sur le téléphone : pas de compte, pas de
      serveur. Disponible sur l'App Store et Google Play.
    highlights:
      - Rendu natif sur les deux plateformes via @expo/ui (SwiftUI sur iOS, Jetpack Compose sur Android), animations Reanimated 4, stockage expo-sqlite
      - Tests, typage et lint sur chaque pull request ; workflow de release EAS avec mises à jour OTA à chaque push sur main

- id: topik-prep
  name: TOPIK Prep
  status: live
  ongoing: true
  period: 2026 – present
  tags: [Expo SDK 58, React Native, TypeScript, Expo Router, "@expo/ui", Reanimated 4, EAS Hosting, OpenAI]
  links:
    - label: Website
      url: https://topikprep.app/
    - label: Google Play
      url: https://play.google.com/store/apps/details?id=com.flavien2.koreanteacher
  en:
    tagline: Prepare the TOPIK, the Korean proficiency exam
    text: >-
      Full TOPIK mock exams built from lessons written for the app, plus an
      oral tab where you answer out loud and an AI grades what you said.
      French or English interface, Korean either way. Live on Google Play
      and on the web.
    highlights:
      - Curriculum, question dealing and grading rules as pure TypeScript modules with tests; recordings generated from the curriculum
      - One server route on EAS Hosting grades spoken answers, the only place a secret lives; the rest runs on the phone
  fr:
    tagline: Préparer le TOPIK, l'examen officiel de coréen
    text: >-
      Des examens blancs complets du TOPIK construits à partir de leçons
      écrites pour l'app, et un onglet oral où l'on répond à voix haute et
      une IA évalue la réponse. Interface en français ou en anglais, le
      coréen reste du coréen. Disponible sur Google Play et sur le web.
    highlights:
      - Programme, tirage des questions et règles de correction en modules TypeScript purs et testés ; enregistrements générés à partir du programme
      - Une seule route serveur sur EAS Hosting évalue l'oral, seul endroit où vit un secret ; tout le reste tourne sur le téléphone

- id: chronarium
  name: Chronarium
  status: live
  ongoing: true
  period: 2025 – present
  tags: [Expo SDK 58, React Native, TypeScript, Expo Router, react-native-svg, Cloudflare R2, EAS Update]
  links:
    - label: Google Play
      url: https://play.google.com/store/apps/details?id=com.felixlambert.chronarium
  en:
    tagline: An illustrated history of the world, from the Big Bang to today
    text: >-
      A chronology of about 1,200 sourced and illustrated entries in 14
      chapters, read as a journey across a map of 32 worlds named after
      the great periods (Palaeozoic, Bronze Age, Renaissance, Cold War…).
      Nothing is locked: you travel from era to era at your own pace. In
      French with an English version on top.
    highlights:
      - Content written as TSV sources, compiled to JSON and held by blocking checkers (sources, English, summaries, places)
      - Hand-drawn SVG map and illustrations, every image credited under a free licence and served as WebP from Cloudflare R2
  fr:
    tagline: Une histoire illustrée du monde, du Big Bang à aujourd'hui
    text: >-
      Une chronologie d'environ 1 200 entrées sourcées et illustrées en 14
      chapitres, lue comme un voyage sur une carte de 32 mondes nommés
      d'après les grandes périodes (Paléozoïque, âge du Bronze, Renaissance,
      guerre froide…). Rien n'est verrouillé : on avance d'époque en époque
      à son rythme. En français, avec une version anglaise.
    highlights:
      - Contenu écrit en TSV, compilé en JSON et tenu par des vérificateurs bloquants (sources, anglais, résumés, lieux)
      - Carte et illustrations en SVG dessinées pour l'app, chaque image créditée sous licence libre et servie en WebP depuis Cloudflare R2

- id: moneytrail
  name: MoneyTrail
  status: wip
  ongoing: true
  period: 2026 – present
  tags: [Expo SDK 58, React Native, TypeScript, Supabase, Plaid, RevenueCat, expo-camera]
  links:
    - label: Website
      url: https://moneytrail.ca/
  en:
    tagline: Follow your money to the groups that receive it
    text: >-
      Scan a receipt or a product and MoneyTrail traces each purchase to
      the corporate group that owns the brand, with an A–E grade for that
      group and a source behind every fact. This week's deals and prices
      show the grade next to each price, and the month's spending adds up
      by group. Scanning and receipts are free; MoneyTrail+ adds bank
      connection.
    highlights:
      - Supabase back end; bank transactions through Plaid stay on the phone, the server only keeps access tokens
      - MoneyTrail+ subscription through in-app purchases on Google Play and the App Store, managed by RevenueCat
  fr:
    tagline: Suivre son argent jusqu'aux groupes qui le reçoivent
    text: >-
      On scanne un ticket ou un produit et MoneyTrail relie chaque achat au
      groupe qui possède la marque, avec une note de A à E pour ce groupe
      et une source derrière chaque fait. Les promos et les prix de la
      semaine affichent la note à côté de chaque prix, et les dépenses du
      mois s'additionnent par groupe. Le scan et les tickets sont gratuits ;
      MoneyTrail+ ajoute la connexion bancaire.
    highlights:
      - Back-end Supabase ; les transactions bancaires passent par Plaid et restent sur le téléphone, le serveur ne garde que les jetons d'accès
      - Abonnement MoneyTrail+ en achat intégré sur Google Play et l'App Store, géré par RevenueCat

- id: chronarium-game
  name: Chronarium, the game
  status: wip
  ongoing: true
  period: 2026 – present
  tags: [Godot 4.5, GDScript, Shaders, Android]
  links: []
  en:
    tagline: Replay the history of the universe, one date per mission
    text: >-
      A mobile game built from Chronarium's timeline: you start at the Big
      Bang and work your way to today. Each date is a short gesture-based
      mission and a place on a map of the universe; clearing it opens the
      path to the next. Around 40 missions so far, from the four
      fundamental forces to the first galaxies and beyond. English by
      default, French one tap away.
    highlights:
      - Godot 4.5 and GDScript, Android first, with custom shaders and sounds
      - An automated playthrough replays the whole game before every change ships
  fr:
    tagline: Rejouer l'histoire de l'univers, une date par mission
    text: >-
      Un jeu mobile construit sur la frise de Chronarium : on part du Big
      Bang et on remonte jusqu'à aujourd'hui. Chaque date est une courte
      mission jouée au geste et un lieu sur la carte de l'univers ; la
      réussir ouvre le chemin jusqu'à la suivante. Une quarantaine de
      missions pour l'instant, des quatre forces fondamentales aux
      premières galaxies et au-delà. En anglais par défaut, en français en
      un geste.
    highlights:
      - Godot 4.5 et GDScript, Android d'abord, avec shaders et sons maison
      - Un essai automatique rejoue la partie complète avant chaque livraison

- id: locale
  name: Locale
  status: wip
  ongoing: true
  period: 2026 – present
  tags: [Electron, node-llama-cpp, llama.cpp, Metal, JavaScript, Hugging Face]
  links: []
  en:
    tagline: A private AI that runs on your computer and says when anything goes online
    text: >-
      A desktop app that looks at your machine (memory, GPU, disk),
      recommends the best open model for what you want to do, downloads it
      once from Hugging Face and then runs it with no internet. A light at
      the top of the window shows at all times whether anything is leaving
      the computer; airplane mode blocks every outgoing connection and a
      network log lists each one.
    highlights:
      - Network guard wrapping fetch, http and https in the main process; the window itself cannot load anything online
      - Model recommendation from available GPU memory and a scored catalogue of 14 open models, checked against Hugging Face
  fr:
    tagline: Une IA privée qui tourne sur l'ordinateur et signale tout ce qui part en ligne
    text: >-
      Une app de bureau qui analyse la machine (mémoire, puce graphique,
      disque), conseille le meilleur modèle ouvert pour l'usage voulu, le
      télécharge une fois depuis Hugging Face, puis tout tourne sans
      Internet. Un voyant en haut de la fenêtre indique en permanence si
      quelque chose sort de l'ordinateur ; le mode avion bloque toute
      connexion sortante et un journal réseau les liste une à une.
    highlights:
      - Garde réseau qui enveloppe fetch, http et https du processus principal ; la fenêtre elle-même ne peut rien charger en ligne
      - Recommandation de modèle selon la mémoire graphique disponible et un catalogue noté de 14 modèles ouverts, vérifié sur Hugging Face

