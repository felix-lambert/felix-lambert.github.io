summary:
  en: >-
    Mobile engineer with 10+ years in front-end and mobile development and
    4 apps shipped to the App Store and Google Play. I build complete
    products: architecture, delivery pipeline, testing and observability,
    from the first commit to the stores. Most recently I built Chexy's
    mobile app from scratch and took it to both stores in under a year, a
    fintech product that helps Canadians earn rewards on rent and build
    credit, now serving 2,500+ daily active users. I work exclusively
    through AI agents, with a focus on AI-first mobile products where AI is
    the core experience. Bilingual English/French, based in Toronto, open
    to mobile roles, on-site or remote.
  fr: >-
    Mobile Engineer avec plus de 10 ans en développement front-end et
    mobile, et 4 applications publiées sur l'App Store et Google Play. Je
    construis des produits complets : architecture, pipeline de livraison,
    tests et observabilité, du premier commit aux stores. Récemment, j'ai
    construit de zéro l'application mobile de Chexy et l'ai publiée sur les
    deux stores en moins d'un an : une fintech qui aide les Canadiens à
    gagner des récompenses sur leur loyer et à bâtir leur crédit, utilisée
    aujourd'hui par plus de 2 500 personnes par jour. Je travaille
    exclusivement avec des agents IA, avec un focus sur les applications
    mobiles AI-first, où l'IA est l'expérience centrale. Bilingue
    anglais/français, basé à Toronto, ouvert aux postes mobile, sur site ou
    à distance.
