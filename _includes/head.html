{%- assign t = site.data.i18n[page.lang] -%}
{%- assign other = 'fr' -%}{%- if page.lang == 'fr' -%}{%- assign other = 'en' -%}{%- endif -%}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  {% seo %}
  {%- if page.translation %}
  <link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="{{ other }}" href="{{ page.translation | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{% if page.lang == 'en' %}{{ page.url | absolute_url }}{% else %}{{ page.translation | absolute_url }}{% endif %}">
  {%- endif %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/img/avatar.jpg' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/inter-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
